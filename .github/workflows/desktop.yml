# Builds the offline Windows app (desktop/) on a real Windows runner: .msi, installer .exe and portable .exe.
# Each run publishes a GitHub Release; https://github.com/<owner>/<repo>/releases/latest is the newest.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'desktop/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.js', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npm ci
        working-directory: desktop
      # every build gets a higher version, so installed apps see it as an update (desktop/updater.cjs)
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
        working-directory: desktop
      - run: npx electron-builder --win msi nsis portable --x64 --publish never
        working-directory: desktop
      # <year>.yml (the licence year in desktop/package.json "expires"): installed apps only take updates of their
      # own licence year (desktop/updater.cjs); latest.yml stays for copies from before the licence (≤ 1.0.21)
      - name: Update file for this licence year
        working-directory: desktop
        shell: bash
        run: |
          y=$(node -p "require('./package.json').expires.slice(0, 4)")
          cp dist/latest.yml "dist/$y.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveByScoreboard-windows
          path: |
            desktop/dist/*.msi
            desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Live by Scoreboard desktop 1.0.${{ github.run_number }}
          body: |
            Offline Windows app: one computer, control on the laptop, scoreboard full screen on the HDMI screen. No internet needed.
            - LiveByScoreboard-Setup-*.exe (recommended): installer that updates itself — when the computer is online it downloads new versions in the background and installs them when the app closes (or Control → "Restart")
            - LiveByScoreboard-*.msi: Windows Installer package; tells you when there is a new version, but you install it yourself
            - LiveByScoreboard-Portable-*.exe: no install, just run; tells you when there is a new version
            Windows may warn the first time (unsigned app): More info → Run anyway.
          # latest.yml + .blockmap: what the installed app reads to find and download an update
          files: |
            desktop/dist/*.msi
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/20*.yml
            desktop/dist/*.blockmap
          make_latest: true
